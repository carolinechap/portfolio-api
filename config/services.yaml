# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Default chat session token lifetime (seconds). Override in .env.local.
    env(CHAT_SESSION_TTL): '1800'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Chat controllers invoked directly from routes.yaml — must be tagged
    # so the resolver can fetch them from the container.
    App\Chat\Controller\ChatController:
        tags: ['controller.service_arguments']
    App\Chat\Controller\ChatSessionController:
        tags: ['controller.service_arguments']

    # Fetched from the container in tests (mint a token / assert validity).
    App\Chat\Service\ChatSessionTokenManager:
        public: true
    App\Chat\Service\ChatQueryCache:
        public: true
    App\Chat\Service\ChatPipeline:
        public: true

    # External services that are stubbed in tests via
    # `self::getContainer()->set(...)`. Marked public to prevent the
    # container from inlining single-use private services, which would
    # otherwise hide them from the test private services locator.
    App\Chat\Service\HCaptchaVerifier:
        public: true
    App\Chat\Service\EmbeddingService:
        public: true
    App\Chat\Service\GeminiClient:
        public: true
    App\Chat\Service\KnowledgeIngester:
        public: true

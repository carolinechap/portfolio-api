api_platform:
    title: Portfolio API
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
    patch_formats:
        json: [ 'application/merge-patch+json' ]
        jsonapi: [ 'application/vnd.api+json' ]
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        stateless: true
        collect_denormalization_errors: true
        cache_headers:
            max_age: 0
            shared_max_age: 0
            vary: [ 'Content-Type', 'Authorization', 'Origin' ]
        extra_properties:
            standard_put: true
            rfc_7807_compliant_errors: true

# In production this is a headless API consumed only by the known front: no
# human browses it.
when@prod:
    api_platform:
        enable_docs: false
        enable_swagger: false
        enable_swagger_ui: false
        enable_re_doc: false
        enable_entrypoint: false

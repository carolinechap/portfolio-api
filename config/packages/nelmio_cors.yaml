nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['POST', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization', 'X-HCaptcha-Token', 'X-Chat-Session', 'Cache-Control']
        expose_headers: ['Link', 'Retry-After']
        max_age: 3600
    paths:
        '^/api/': # Specific configuration for API routes
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_methods: ['POST', 'OPTIONS']
            allow_headers: ['Content-Type', 'Authorization', 'X-HCaptcha-Token', 'X-Chat-Session', 'Cache-Control']
            expose_headers: ['Link', 'Retry-After']
            max_age: 3600
